{# Пачка рисуется в SVG по цвету товара, поэтому каталог обходится без загрузки картинок #}
<svg class="pack" viewBox="0 0 200 240" role="img" aria-label="{{ name }}">
    <path d="M40 30 L160 30 L172 228 Q100 238 28 228 Z" fill="{{ color }}"/>
    <path d="M40 30 L160 30 L163 54 L37 54 Z" fill="#000" opacity=".18"/>
    <path d="M44 14 L156 14 L160 30 L40 30 Z" fill="{{ color }}"/>
    <path d="M44 14 L156 14 L160 30 L40 30 Z" fill="#fff" opacity=".12"/>
    {% for x in [60, 80, 100, 120, 140] %}
        <line x1="{{ x }}" y1="16" x2="{{ x }}" y2="28" stroke="#000" stroke-opacity=".15"/>
    {% endfor %}
    <rect x="52" y="86" width="96" height="104" rx="6" fill="#f6efe6"/>
    <g transform="translate(100 118)" fill="{{ color }}">
        <ellipse rx="10" ry="14" transform="rotate(25)"/>
        <path d="M-4 -12c-3 9 11 15 8 24" transform="rotate(25)" stroke="#f6efe6" stroke-width="2" fill="none"/>
    </g>
    <text x="100" y="158" text-anchor="middle" font-size="11" font-family="Georgia, serif" fill="#2b1d14">ЗЕРНО</text>
    <text x="100" y="176" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" fill="#6b5546">{{ weight }}</text>
</svg>
